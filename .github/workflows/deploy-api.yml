name: Deploy API to Azure Container Apps

on:
  push:
    branches: [main]
    paths:
      - 'TrashAnimal/**'
      - 'TrashAnimal.Api/**'
      - 'infra/main.bicep'
      - '.github/workflows/deploy-api.yml'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: TrashAnimal.Api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trashanimal-api:latest
            ghcr.io/${{ github.repository_owner }}/trashanimal-api:${{ github.sha }}

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        run: |
          az deployment group create \
            --resource-group trashanimal-rg \
            --mode Incremental \
            --template-file infra/main.bicep \
            --parameters \
              containerImage=ghcr.io/${{ github.repository_owner }}/trashanimal-api:${{ github.sha }} \
              ghcrUsername=${{ github.actor }} \
              ghcrPassword=${{ secrets.GHCR_PULL_PAT }}
